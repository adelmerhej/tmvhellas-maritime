<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="Titan Maritime Ventures mark">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143A6B"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21B6C7"/>
      <stop offset="1" stop-color="#1557A8"/>
    </linearGradient>
  </defs>
  <!-- bow spray / horizon ring -->
  <circle cx="36" cy="36" r="33" fill="none" stroke="#0B1F3A" stroke-opacity=".12" stroke-width="1.5"/>
  <!-- funnel accent -->
  <rect x="50" y="15" width="5" height="9" rx="1" fill="#C9A961"/>
  <!-- bridge & superstructure (aft) -->
  <rect x="47" y="23" width="11" height="6" rx="1.2" fill="url(#hull)"/>
  <rect x="44" y="29" width="16" height="8" rx="1.2" fill="url(#hull)"/>
  <!-- deck line -->
  <rect x="12" y="35" width="32" height="2.4" rx="1.2" fill="#C9A961"/>
  <!-- tanker hull with raked bow -->
  <path d="M5 38 H64 L59 49 H14 Q8 49 5 42 Z" fill="url(#hull)"/>
  <!-- waterline highlight -->
  <path d="M12 47.5 H58" stroke="#21B6C7" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
  <!-- waves -->
  <path d="M6 55 c4 -4 8 -4 12 0 s8 4 12 0 s8 -4 12 0 s8 4 12 0 s6 -3 10 0" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round"/>
  <path d="M12 62 c4 -4 8 -4 12 0 s8 4 12 0 s8 -4 12 0 s8 4 12 0" fill="none" stroke="url(#wave)" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round"/>
</svg>
